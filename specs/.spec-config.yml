# spec workflow configuration
#
# AutoCreateBranch — controla si /spec crea la rama de git del spec automáticamente (al escribirlo).
#   true  (default) → /spec crea y cambia a la rama <tipo>/<descripcion-corta> (ver «Convenciones Git» en CLAUDE.md) sin preguntar
#   false           → /spec pide confirmación [y/N] antes de crear la rama
AutoCreateBranch: true
