<div class="flex w-full flex-col px-5 py-6">
  <div class="flex items-center justify-between">
    <h1 class="font-display text-2xl font-extrabold tracking-[-0.02em]">Productos</h1>
    <a
      routerLink="/admin/productos/nuevo"
      aria-label="Nuevo producto"
      class="flex h-10 w-10 items-center justify-center rounded-full bg-accent text-xl font-bold text-white"
    >
      +
    </a>
  </div>

  @if (loading()) {
    <p class="mt-5 text-sm text-muted">Cargando…</p>
  } @else if (items().length === 0) {
    <p class="mt-5 text-sm text-muted">Todavía no hay productos. Toca + para dar de alta el primero.</p>
  } @else {
    <ul class="mt-5 flex flex-col gap-2">
      @for (item of items(); track item.id) {
        <li class="flex items-center justify-between rounded-lg border border-line bg-white px-4 py-3">
          <div>
            <p class="m-0 text-[15px] font-semibold">{{ item.name }}</p>
            <p class="m-0 text-sm text-muted">{{ categoriaDe(item.categoryId) }}</p>
          </div>
          <span class="text-sm font-bold">{{ item.stock }} pz</span>
        </li>
      }
    </ul>
  }
</div>
