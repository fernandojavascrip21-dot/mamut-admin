<div class="relative flex min-h-screen w-full flex-col bg-page sm:items-center sm:justify-center sm:py-12">
<div class="flex w-full flex-1 flex-col sm:max-w-[420px] sm:flex-none sm:overflow-hidden sm:rounded-3xl sm:border sm:border-line sm:bg-white sm:shadow-sm">
  <header class="flex items-center gap-3 border-b border-line bg-white p-3">
    <button
      type="button"
      (click)="goBack()"
      aria-label="Volver"
      class="flex h-11 w-11 items-center justify-center text-ink"
    >
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>
    <h1 class="text-lg font-bold">Mi cuenta</h1>
  </header>

  <div class="flex flex-1 flex-col gap-4 p-6">
    <div class="flex items-center gap-3.5">
      <div
        aria-hidden="true"
        class="flex h-[60px] w-[60px] items-center justify-center rounded-full text-xl font-bold text-white"
        [class]="isAdmin() ? 'bg-ink' : 'bg-accent-2'"
      >
        {{ initials() }}
      </div>
      <div>
        <div class="text-xl font-bold">{{ user()?.fullName }}</div>
        <span
          class="mt-1 inline-block rounded-md px-2 py-0.5 text-xs font-bold"
          [class]="isAdmin() ? 'bg-disabled text-ink' : 'bg-[#DCEFF3] text-[#0B4F61]'"
        >
          {{ isAdmin() ? 'Administrador' : 'Vendedor' }}
        </span>
      </div>
    </div>

    <p class="text-sm leading-relaxed text-muted">{{ passwordNote() }}</p>

    <div class="flex-1"></div>

    <button
      type="button"
      (click)="askLogout()"
      class="flex h-[54px] items-center justify-center gap-2 rounded-xl border border-danger text-[17px] font-bold text-danger"
    >
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <path d="m16 17 5-5-5-5"></path>
        <path d="M21 12H9"></path>
      </svg>
      Cerrar sesión
    </button>
  </div>
</div>

  @if (confirmingLogout()) {
    <div class="fixed inset-0 flex items-center justify-center bg-black/55 p-6">
      <div
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-logout-title"
        aria-describedby="confirm-logout-desc"
        class="flex w-full max-w-sm flex-col gap-3 rounded-2xl bg-white p-5"
      >
        <h2 id="confirm-logout-title" class="text-lg font-bold">¿Cerrar sesión?</h2>
        <p id="confirm-logout-desc" class="text-[15px] leading-relaxed text-muted">
          Para volver a entrar necesitarás tu usuario y contraseña. Lo que ya registraste queda
          guardado.
        </p>
        <div class="mt-1 flex gap-2.5">
          <button
            type="button"
            (click)="cancelLogout()"
            class="h-[50px] flex-1 rounded-xl border border-line-strong font-semibold"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="confirmLogout()"
            class="h-[50px] flex-1 rounded-xl bg-danger font-bold text-white"
          >
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  }
</div>
