<div class="pointer-events-none fixed inset-x-4 top-4 z-50 flex justify-center sm:justify-end" aria-live="polite">
  @if (toastService.current(); as toast) {
    <div
      class="toast pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-xl border py-2 pr-2 pl-3.5 shadow-lg motion-safe:animate-[toast-in_180ms_ease-out]"
      [class]="toast.tone === 'success'
        ? 'border-success-border bg-success-bg text-success-text'
        : 'border-danger-border bg-danger-bg text-danger-text'"
      [attr.role]="toast.tone === 'success' ? 'status' : 'alert'"
    >
      @if (toast.tone === 'success') {
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 stroke-success">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
      } @else {
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 stroke-danger">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v4M12 16h.01"></path>
        </svg>
      }
      <p class="m-0 flex-1 text-sm font-semibold leading-snug">{{ toast.message }}</p>
      <button
        type="button"
        class="dismiss flex size-11 shrink-0 items-center justify-center rounded-lg text-lg font-bold"
        aria-label="Cerrar notificación"
        (click)="toastService.dismiss()"
      >
        ×
      </button>
    </div>
  }
</div>
