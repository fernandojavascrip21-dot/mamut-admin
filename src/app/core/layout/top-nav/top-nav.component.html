<header
  [id]="sidebarId"
  [class.lg:-ml-64]="sidebar.collapsed()"
  [class.lg:opacity-0]="sidebar.collapsed()"
  [class.lg:invisible]="sidebar.collapsed()"
  class="sticky top-0 z-10 animate-rise-in bg-ink text-page motion-reduce:animate-none lg:flex lg:h-screen lg:w-64 lg:shrink-0 lg:flex-col lg:self-start lg:overflow-y-auto lg:px-4 lg:py-6 lg:transition-[margin-left,opacity,visibility] lg:duration-300 lg:ease-out motion-reduce:transition-none"
>
  <!-- En celular: fila de marca + cuenta y el menú en su propia banda. En escritorio es una barra
       lateral: la fila se disuelve (lg:contents) y sus hijos se ordenan con order-* junto al
       bloque proyectado («Viendo»), sin duplicar el menú en el DOM. -->
  <div class="mx-auto flex w-full max-w-7xl flex-wrap items-center lg:contents">
    <div class="order-1 flex min-w-0 items-center gap-3 px-4 py-3 lg:order-1 lg:p-0 lg:pb-4">
      <img
        src="logo-mammoth.png"
        [alt]="brandName"
        class="h-10 w-10 shrink-0 rounded-full object-cover ring-2 ring-accent ring-offset-2 ring-offset-ink"
      />
      <div class="flex min-w-0 flex-col leading-none">
        <span class="truncate font-display text-lg font-extrabold tracking-[-0.02em]">{{
          brandName
        }}</span>
        <span class="mt-1 font-mono text-[10px] font-bold tracking-[0.18em] text-accent uppercase">{{
          roleLabel()
        }}</span>
      </div>
      <!-- Solo escritorio: en celular el menú va arriba y no hay barra lateral que ocultar. -->
      <button
        type="button"
        (click)="sidebar.toggle()"
        [attr.aria-label]="hideSidebarLabel"
        [attr.aria-controls]="sidebarId"
        aria-expanded="true"
        class="ml-auto hidden h-11 w-11 shrink-0 cursor-pointer items-center justify-center rounded-xl text-page/70 transition-colors duration-200 hover:bg-page/10 hover:text-page focus-visible:outline-page motion-reduce:transition-none lg:flex"
      >
        <app-nav-icon name="panel-close" />
      </button>
    </div>

    <div class="order-2 ml-auto flex shrink-0 items-center gap-2 px-4 py-3 lg:order-4 lg:mt-auto lg:ml-0 lg:w-full lg:justify-between lg:p-0 lg:pt-4">
      <!-- El contador de items del carrito (M2/M3) va aquí cuando exista; hoy no tiene datos reales. -->
      <a
        [routerLink]="cart().path"
        routerLinkActive
        #cartRla="routerLinkActive"
        [attr.aria-current]="cartRla.isActive ? 'page' : null"
        [attr.aria-label]="cart().label"
        class="flex h-11 w-11 items-center justify-center rounded-xl border transition-[background-color,color,border-color] duration-200 focus-visible:outline-page motion-reduce:transition-none"
        [class]="
          cartRla.isActive
            ? 'border-accent bg-accent text-white'
            : 'border-page/20 text-page/85 hover:border-page/40 hover:text-page'
        "
      >
        <app-nav-icon name="cart" />
      </a>

      <a
        routerLink="/cuenta"
        [attr.aria-label]="accountLabel"
        class="flex h-11 w-11 items-center justify-center rounded-xl font-mono text-sm font-bold tracking-wider text-white ring-1 ring-page/25 transition-shadow duration-200 hover:ring-2 hover:ring-page/60 focus-visible:outline-page motion-reduce:transition-none"
        [class]="avatarBg()"
      >
        {{ initials() }}
      </a>
    </div>

    <!-- Menú de celdas en celular; en escritorio, pestañas en línea. La activa se llena desde
         abajo como un nivel de stock (mismo gesto que las columnas del login). -->
    <nav
      class="order-3 w-full border-y border-page/10 bg-ink-raised lg:order-3 lg:w-full lg:flex-none lg:border-0 lg:bg-transparent"
      [attr.aria-label]="ariaLabel()"
    >
      <div
        class="grid divide-x divide-page/10 lg:flex lg:flex-col lg:gap-1 lg:divide-x-0"
        [class]="gridColsClass()"
      >
        @for (item of menu(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            class="relative isolate flex min-h-17 flex-col items-center justify-center gap-1 px-1 py-2.5 font-display text-[12px] leading-tight font-bold tracking-wide transition-colors duration-200 focus-visible:-outline-offset-4 focus-visible:outline-page motion-reduce:transition-none lg:min-h-11 lg:flex-row lg:justify-start lg:gap-2 lg:rounded-xl lg:px-4 lg:py-0 lg:text-sm"
            [class]="rla.isActive ? 'text-white' : 'text-page/60 hover:text-page lg:hover:bg-page/5'"
          >
            @if (rla.isActive) {
              <span
                aria-hidden="true"
                class="absolute inset-1.5 -z-10 origin-bottom animate-stock-grow rounded-xl bg-accent shadow-lg shadow-accent/30 motion-reduce:animate-none lg:inset-0"
              ></span>
            }
            <app-nav-icon [name]="item.icon" />
            {{ item.label }}
          </a>
        }
      </div>
    </nav>
  </div>

  <div class="mx-auto w-full max-w-7xl px-4 py-3 empty:hidden lg:order-2 lg:mx-0 lg:max-w-none lg:px-0 lg:py-4">
    <!-- Lo que el shell proyecte (la barra «Viendo» del administrador) queda fijo bajo el menú. -->
    <ng-content />
  </div>
</header>

@if (sidebar.collapsed()) {
  <button
    type="button"
    (click)="sidebar.toggle()"
    [attr.aria-label]="showSidebarLabel"
    [attr.aria-controls]="sidebarId"
    aria-expanded="false"
    class="fixed top-3 left-3 z-20 hidden animate-rise-in [animation-delay:150ms] motion-reduce:animate-none h-11 w-11 cursor-pointer items-center justify-center rounded-xl bg-ink text-page shadow-raised ring-1 ring-page/20 transition-colors duration-200 hover:bg-ink-raised focus-visible:outline-accent motion-reduce:transition-none lg:flex"
  >
    <app-nav-icon name="panel-open" />
  </button>
}
