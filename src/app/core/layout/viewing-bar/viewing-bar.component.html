<div
  class="border-b border-black/10 px-5 py-2 text-white transition-colors duration-200 motion-reduce:transition-none"
  [class]="selectedSeller() ? 'bg-accent-hover' : 'bg-ink'"
>
  <div class="mx-auto flex w-full max-w-5xl items-center gap-3">
    <label for="viewing-select" class="font-display text-sm font-semibold tracking-wide">{{ label }}</label>

    <div class="relative min-w-0 flex-1 sm:max-w-xs">
      @if (selectedSeller()) {
        <span
          aria-hidden="true"
          class="pointer-events-none absolute top-1/2 left-2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full bg-white text-xs font-bold text-accent-hover"
        >
          {{ initials() }}
        </span>
      }
      <select
        id="viewing-select"
        [disabled]="status() === 'loading'"
        [attr.aria-busy]="status() === 'loading' ? 'true' : null"
        (change)="onChange($event)"
        class="h-11 w-full cursor-pointer appearance-none truncate rounded-lg border border-white/40 bg-white/10 pr-10 text-[15px] font-bold text-white focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-wait disabled:opacity-70"
        [class]="selectedSeller() ? 'pl-11' : 'pl-3'"
      >
        <option class="text-ink" [value]="warehouseValue" [selected]="selectedSellerId() === null">
          {{ warehouseLabel }}
        </option>
        @for (seller of sellers(); track seller.id) {
          <option class="text-ink" [value]="seller.id" [selected]="seller.id === selectedSellerId()">
            {{ seller.fullName }}
          </option>
        }
      </select>
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2"
      >
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </div>

    @if (status() === 'error') {
      <span class="sr-only" role="status">{{ errorHint }}</span>
      <button
        type="button"
        (click)="retry.emit()"
        class="retry h-11 flex-shrink-0 rounded-lg border border-white/40 px-3 text-sm font-semibold text-white hover:bg-white/10 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-white"
      >
        {{ retryLabel }}
      </button>
    }
  </div>
</div>
