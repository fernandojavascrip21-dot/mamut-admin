<div
  class="rounded-xl border px-3 py-1.5 text-page lg:w-full transition-colors duration-200 motion-reduce:transition-none"
  [class]="selectedSeller() ? 'border-accent bg-accent/15' : 'border-page/10 bg-ink-raised'"
>
  <div class="flex w-full items-center gap-3 lg:flex-col lg:items-start lg:gap-1.5">
    <label
      id="viewing-label"
      for="viewing-select"
      class="font-display text-sm font-semibold tracking-wide"
      >{{ label }}</label
    >

    <div class="min-w-0 flex-1 sm:w-72 sm:flex-none lg:w-full">
      <p-select
        inputId="viewing-select"
        ariaLabelledBy="viewing-label"
        [options]="options()"
        optionLabel="label"
        optionValue="id"
        [ngModel]="value()"
        (onChange)="onChange($event)"
        [disabled]="status() === 'loading'"
        [pt]="{ label: { 'aria-busy': status() === 'loading' ? 'true' : null } }"
        [showClear]="false"
        appendTo="body"
        [panelStyle]="panelStyle"
        [motionOptions]="motionOptions"
        class="viewing-select flex min-w-0 w-full"
      >
        <ng-template #selectedItem let-option>
          <span class="flex min-w-0 items-center gap-2">
            @if (selectedSeller()) {
              <span
                aria-hidden="true"
                class="initials flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-white text-xs font-bold text-accent-hover"
              >
                {{ initials() }}
              </span>
            }
            <span class="truncate">{{ option.label }}</span>
          </span>
        </ng-template>
      </p-select>
    </div>

    @if (status() === 'error') {
      <span class="sr-only" role="status">{{ errorHint }}</span>
      <button
        type="button"
        (click)="retry.emit()"
        class="retry h-11 flex-shrink-0 rounded-lg border border-page/40 px-3 text-sm font-semibold text-page transition-colors duration-200 hover:bg-white/10 motion-reduce:transition-none focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-page"
      >
        {{ retryLabel }}
      </button>
    }
  </div>
</div>
