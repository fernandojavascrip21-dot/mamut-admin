<header class="sticky top-0 z-10 bg-white">
  <div class="border-b border-line px-5 py-3">
    <div class="mx-auto flex w-full max-w-5xl items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img src="logo-mammoth.png" alt="Mammut Supplements" class="h-9 w-9 rounded-full object-cover" />
        <span class="text-sm font-semibold text-muted">Mammut Supplements</span>
      </div>
      <div class="flex items-center gap-2">
        <!-- El contador de items del carrito (M2/M3) va aquí cuando exista; hoy no tiene datos reales. -->
        <a
          [routerLink]="cart().path"
          routerLinkActive
          #cartRla="routerLinkActive"
          [attr.aria-current]="cartRla.isActive ? 'page' : null"
          [attr.aria-label]="cart().label"
          class="relative flex h-11 w-11 items-center justify-center rounded-full transition-colors"
          [class]="cartRla.isActive ? 'bg-accent-2-bg text-accent-2-text' : 'text-ink hover:bg-page'"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="21" r="1"></circle>
            <circle cx="19" cy="21" r="1"></circle>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
          </svg>
        </a>

        <a
          routerLink="/cuenta"
          aria-label="Mi cuenta"
          class="flex h-11 w-11 items-center justify-center rounded-full text-sm font-bold text-white"
          [class]="avatarBg()"
        >
          {{ initials() }}
        </a>
      </div>
    </div>
  </div>

  <nav class="border-b border-line" [attr.aria-label]="ariaLabel()">
    <div class="mx-auto grid w-full max-w-5xl" [class]="gridColsClass()">
      @for (item of menu(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          class="flex flex-col items-center gap-1 px-1 py-2.5 text-[11px] font-semibold transition-colors"
          [class]="rla.isActive ? 'text-accent-2-text' : 'text-muted hover:bg-page'"
        >
          <span
            class="flex items-center justify-center rounded-xl px-3 py-1 transition-colors"
            [class]="rla.isActive ? 'bg-accent-2-bg' : ''"
          >
            <svg
              aria-hidden="true"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              @switch (item.icon) {
                @case ('package') {
                  <path
                    d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"
                  ></path>
                  <path d="M12 22V12"></path>
                  <polyline points="3.29 7 12 12 20.71 7"></polyline>
                  <path d="m7.5 4.27 9 5.15"></path>
                }
                @case ('tag') {
                  <path
                    d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"
                  ></path>
                  <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle>
                }
                @case ('bag') {
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                  <path d="M3.103 6.034h17.794"></path>
                  <path
                    d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"
                  ></path>
                }
                @case ('receipt') {
                  <path d="M12 17V7"></path>
                  <path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"></path>
                  <path
                    d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"
                  ></path>
                }
                @case ('users') {
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                }
              }
            </svg>
          </span>
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
</header>
