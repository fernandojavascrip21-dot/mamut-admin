<div class="flex items-center justify-between gap-4 rounded-card border border-line bg-white py-1.5 pr-1.5 pl-4 shadow-raised">
  <div class="min-w-0 leading-tight">
    <p class="summary m-0 text-xs font-semibold text-muted">{{ summary() }}</p>
    <p class="total m-0 font-mono text-lg font-bold">{{ totalAmount() | currency: 'MXN' : 'symbol-narrow' }}</p>
  </div>
  <a pButton [routerLink]="cartUrl()" class="view-cart h-11 shrink-0 px-4 text-sm">{{ texts.viewCart }} →</a>
</div>
