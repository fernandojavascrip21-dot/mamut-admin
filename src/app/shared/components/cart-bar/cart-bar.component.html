<div class="flex items-center justify-between gap-3 border-t border-line bg-white px-5 py-3 shadow-raised">
  <div class="min-w-0">
    <p class="summary m-0 text-sm font-semibold">{{ summary() }}</p>
    <p class="total m-0 font-mono text-lg font-bold">{{ totalAmount() | currency: 'MXN' : 'symbol-narrow' }}</p>
  </div>
  <a pButton [routerLink]="cartUrl()" class="view-cart h-12 shrink-0 px-5 text-sm">{{ texts.viewCart }} →</a>
</div>
