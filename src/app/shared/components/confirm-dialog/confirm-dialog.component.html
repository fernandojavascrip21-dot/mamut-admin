<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/55 p-6">
  <div
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    [attr.aria-describedby]="message() ? 'confirm-dialog-desc' : null"
    (keydown)="onKeydown($event)"
    class="surface-card flex w-full max-w-sm flex-col gap-4 p-6 shadow-raised"
  >
    <h2 id="confirm-dialog-title" class="font-display text-[24px] font-extrabold tracking-tight">
      {{ title() }}
    </h2>
    @if (message()) {
      <p id="confirm-dialog-desc" class="text-[15px] leading-relaxed text-muted">{{ message() }}</p>
    }
    <div class="mt-1 flex gap-2.5">
      <button
        #cancelButton
        type="button"
        (click)="cancelled.emit()"
        class="btn-secondary flex-1 px-3 text-[15px]"
      >
        {{ cancelLabel() }}
      </button>
      <button
        #confirmButton
        type="button"
        (click)="confirmed.emit()"
        [class]="
          'btn-primary flex-1 px-3 text-[15px] ' +
          (tone() === 'danger' ? 'bg-danger hover:bg-danger-text' : '')
        "
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
