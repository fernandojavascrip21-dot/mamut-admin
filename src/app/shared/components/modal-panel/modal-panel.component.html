<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [blockScroll]="true"
  [focusTrap]="true"
  [draggable]="false"
  [resizable]="false"
  [styleClass]="dialogClass()"
  [motionOptions]="motionOptions"
  appendTo="body"
>
  <ng-template #header>
    <div class="flex w-full min-w-0 items-center justify-between gap-3">
      <h2 class="page-title m-0 min-w-0 text-[24px]">{{ title() }}</h2>
      @if (closable()) {
        <button
          pButton
          type="button"
          severity="secondary"
          [text]="true"
          class="p-dialog-close-button h-11 w-11 shrink-0 px-0"
          [attr.aria-label]="closeLabel"
          (click)="requestClose()"
        >
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      }
    </div>
  </ng-template>
  <ng-content />
</p-dialog>
