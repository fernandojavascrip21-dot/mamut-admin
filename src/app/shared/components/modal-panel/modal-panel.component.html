<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="closable()"
  [closeOnEscape]="closable()"
  [dismissableMask]="false"
  [blockScroll]="true"
  [focusTrap]="true"
  [draggable]="false"
  [resizable]="false"
  [styleClass]="styleClass"
  [motionOptions]="motionOptions"
  appendTo="body"
>
  <ng-template #header>
    <h2 class="page-title m-0 text-[24px]">{{ title() }}</h2>
  </ng-template>
  <ng-content />
</p-dialog>
