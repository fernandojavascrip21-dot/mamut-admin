<div class="fixed inset-0 z-40 flex items-stretch justify-center bg-black/55 sm:items-center sm:p-6">
  <div
    #panel
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-panel-title"
    tabindex="-1"
    (keydown)="onKeydown($event)"
    class="flex h-full w-full min-w-0 flex-col overflow-hidden bg-page shadow-raised outline-none sm:h-auto sm:max-h-full sm:max-w-xl sm:rounded-card"
  >
    <header class="flex flex-shrink-0 items-center justify-between gap-3 border-b border-line px-5 py-3">
      <h2 id="modal-panel-title" class="page-title m-0 text-[24px]">{{ title() }}</h2>
      @if (closable()) {
        <button pButton [text]="true"
          type="button"
          class="text-sm close h-11 w-11 flex-shrink-0 px-0"
          aria-label="Cerrar"
          (click)="closed.emit()"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      }
    </header>
    <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-5 py-5">
      <ng-content />
    </div>
  </div>
</div>
