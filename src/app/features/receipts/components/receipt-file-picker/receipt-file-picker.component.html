<div class="flex flex-col items-start gap-4 surface-card p-6">
  <p class="m-0 text-base font-semibold text-ink">Sube la remisión en Excel (.xlsx), PDF o imagen (JPG o PNG).</p>
  <div class="flex w-full flex-wrap items-center justify-between gap-3">
    <button
      pButton
      type="button"
      severity="secondary"
      class="h-11 px-5 text-sm"
      (click)="fileInput.click()"
    >
      Elegir archivo
    </button>
    <a
      [routerLink]="pendingLink"
      class="text-sm font-semibold text-accent underline-offset-4 hover:underline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-accent"
    >Pendientes de remisiones</a>
  </div>
  <input
    #fileInput
    hidden
    type="file"
    [attr.accept]="accept"
    (change)="pick(fileInput)"
  />
</div>
