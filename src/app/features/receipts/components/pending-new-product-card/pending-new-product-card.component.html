<article class="surface-card flex flex-col gap-4 p-4">
  <div class="flex min-w-0 flex-col gap-1">
    <h2 class="m-0 break-words text-base font-bold text-ink">{{ item().suggestedName }}</h2>
    <p class="m-0 text-sm font-semibold text-muted tabular-nums">{{ item().qty }} piezas</p>
    @if (item().unitCost !== null) {
      <p class="m-0 text-sm text-muted tabular-nums">Costo leído {{ item().unitCost | currency: 'MXN' : 'symbol-narrow' : '1.2-4' }}</p>
    } @else {
      <p class="m-0 text-sm text-muted">Sin costo leído</p>
    }
    <p class="m-0 text-xs text-faint">Remisión del {{ dateLabel() }}</p>
  </div>

  <div class="flex flex-col gap-2 sm:flex-row">
    <button pButton type="button" class="h-11 w-full px-4 text-sm sm:w-auto" [disabled]="busy()" (click)="createRequested.emit()">Dar de alta</button>
    <button pButton type="button" severity="danger" [outlined]="true" class="h-11 w-full px-4 text-sm sm:w-auto" [disabled]="busy()" (click)="discardRequested.emit()">Descartar</button>
  </div>
</article>
