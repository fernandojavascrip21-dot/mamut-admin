<div
  class="relative flex min-h-screen w-full flex-col bg-page px-4 py-6 sm:items-center sm:justify-center sm:py-12"
>
  <div
    class="surface-card flex w-full flex-1 flex-col overflow-hidden sm:max-w-[420px] sm:flex-none"
  >
    <header class="flex items-center gap-3 border-b border-page/10 bg-ink p-3 text-page">
      <button
        type="button"
        (click)="goBack()"
        aria-label="Volver"
        class="btn-ghost h-11 w-11 px-0 text-page hover:bg-page/10 focus-visible:outline-page"
      >
        <svg
          aria-hidden="true"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </button>
      <h1 class="page-title text-[24px] text-page">Mi cuenta</h1>
    </header>

    <div class="flex flex-1 flex-col gap-4 p-6">
      <div class="flex items-center gap-3.5">
        <div
          aria-hidden="true"
          class="flex h-[60px] w-[60px] items-center justify-center rounded-full text-xl font-bold text-white"
          [class]="isAdmin() ? 'bg-ink' : 'bg-accent-2'"
        >
          {{ initials() }}
        </div>
        <div>
          <div class="text-xl font-bold">{{ user()?.fullName }}</div>
          <span
            class="mt-1 inline-block rounded-md px-2 py-0.5 text-xs font-bold"
            [class]="isAdmin() ? 'bg-disabled text-ink' : 'bg-accent-2-bg text-accent-2-text'"
          >
            {{ isAdmin() ? 'Administrador' : 'Vendedor' }}
          </span>
        </div>
      </div>

      <p class="text-sm leading-relaxed text-muted">{{ passwordNote() }}</p>

      <div class="flex-1"></div>

      <button
        type="button"
        (click)="askLogout()"
        class="btn-secondary h-[54px] gap-2 border-danger text-[17px] text-danger hover:bg-danger-bg"
      >
        <svg
          aria-hidden="true"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="m16 17 5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </div>

  @if (confirmingLogout()) {
    <app-confirm-dialog
      title="¿Cerrar sesión?"
      message="Para volver a entrar necesitarás tu usuario y contraseña. Lo que ya registraste queda guardado."
      confirmLabel="Cerrar sesión"
      cancelLabel="Cancelar"
      tone="danger"
      (confirmed)="confirmLogout()"
      (cancelled)="cancelLogout()"
    />
  }
</div>
