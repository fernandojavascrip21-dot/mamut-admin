<p-card class="block border border-line" [pt]="cardPassThrough" aria-hidden="true">
  <div class="flex flex-col gap-3 p-4">
    <div class="flex gap-4">
      <p-skeleton width="6rem" height="6rem" borderRadius="0.375rem" class="shrink-0" />
      <div class="flex flex-1 flex-col justify-center gap-2">
        <p-skeleton height="0.9rem" width="70%" />
        <p-skeleton height="0.9rem" width="35%" />
        <p-skeleton height="0.8rem" width="45%" />
      </div>
    </div>
    <p-skeleton height="2.75rem" borderRadius="0.5rem" />
  </div>
</p-card>
