<div
  class="flex items-center gap-3 surface-card p-3"
  [class]="
    editable()
      ? 'editable cursor-pointer hover:border-accent focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-accent'
      : ''
  "
  [attr.role]="editable() ? 'button' : null"
  [attr.tabindex]="editable() ? 0 : null"
  [attr.aria-label]="editable() ? 'Editar ' + name() : null"
  (click)="activate()"
  (keydown.enter)="activate()"
  (keydown.space)="onSpace($event)"
>
  @if (showPhoto()) {
    <img
      [src]="image()"
      [alt]="name()"
      loading="lazy"
      (error)="onPhotoError()"
      class="h-12 w-12 flex-shrink-0 rounded-md object-cover"
    />
  } @else {
    <div
      class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-md bg-line text-sm font-bold text-ink"
      aria-hidden="true"
    >
      {{ initials() }}
    </div>
  }
  <div class="flex min-w-0 flex-1 flex-col gap-0.5">
    <p class="name m-0 text-[15px] leading-tight font-bold break-words">{{ name() }}</p>
    @if (breakdown()) {
      <p class="breakdown m-0 text-xs leading-snug break-words text-muted">{{ breakdown() }}</p>
    }
  </div>
  <div class="flex shrink-0 flex-col items-end gap-0.5">
    <p class="units m-0 font-mono text-base font-bold whitespace-nowrap">{{ unitsText() }}</p>
    @if (stockLevel() === 'out') {
      <p class="out m-0 text-xs font-bold tracking-wide text-danger uppercase">{{ outLabel }}</p>
    }
  </div>
</div>
