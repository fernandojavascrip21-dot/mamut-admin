<nav aria-label="Movimientos rápidos" class="grid grid-cols-[repeat(auto-fit,minmax(11rem,1fr))] gap-2">
  @for (action of actions(); track action.label) {
    <a
      pButton
      severity="secondary"
      [routerLink]="action.link"
      class="quick-action h-11 justify-start gap-2 px-4 text-sm"
    >
      <svg
        aria-hidden="true"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="shrink-0"
      >
        @switch (action.icon) {
          @case ('entry') {
            <path d="M12 3v12"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 21h14"></path>
          }
          @case ('deliver') {
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          }
          @case ('return') {
            <path d="M19 12H5"></path>
            <path d="m11 6-6 6 6 6"></path>
          }
          @case ('sell') {
            <circle cx="9" cy="20" r="1.5"></circle>
            <circle cx="18" cy="20" r="1.5"></circle>
            <path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"></path>
          }
          @case ('new') {
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          }
          @case ('shrinkage') {
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M8 12h8"></path>
          }
          @case ('restock') {
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <path d="M9 12h6"></path>
            <path d="M9 16h6"></path>
          }
          @case ('receipt') {
            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"></path>
            <path d="M9 8h6"></path>
            <path d="M9 12h6"></path>
          }
          @case ('fraction') {
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <path d="M20 4 8.12 15.88"></path>
            <path d="M14.47 14.48 20 20"></path>
            <path d="M8.12 8.12 12 12"></path>
          }
        }
      </svg>
      {{ action.label }}
    </a>
  }
  <!-- Contenido extra al final de la fila (HU-18: «Baja existencia», con su globo). Lo arma la página. -->
  <ng-content />
</nav>
