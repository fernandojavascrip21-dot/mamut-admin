<nav aria-label="Movimientos rápidos" class="grid grid-cols-1 gap-2 sm:auto-cols-fr sm:grid-flow-col">
  @for (action of actions(); track action.label) {
    <a
      pButton
      severity="secondary"
      [routerLink]="action.link"
      class="quick-action h-11 justify-start gap-2 px-4 text-sm"
    >
      <svg
        aria-hidden="true"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="shrink-0"
      >
        @switch (action.icon) {
          @case ('entry') {
            <path d="M12 3v12"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 21h14"></path>
          }
          @case ('deliver') {
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          }
          @case ('return') {
            <path d="M19 12H5"></path>
            <path d="m11 6-6 6 6 6"></path>
          }
          @case ('sell') {
            <circle cx="9" cy="20" r="1.5"></circle>
            <circle cx="18" cy="20" r="1.5"></circle>
            <path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"></path>
          }
          @case ('new') {
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          }
          @case ('fraction') {
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <path d="M20 4 8.12 15.88"></path>
            <path d="M14.47 14.48 20 20"></path>
            <path d="M8.12 8.12 12 12"></path>
          }
        }
      </svg>
      {{ action.label }}
    </a>
  }
</nav>
