<div class="flex h-3.5 w-full gap-0.5 overflow-hidden rounded-full bg-line" aria-hidden="true">
  @for (segment of segments(); track segment.key) {
    <span
      class="segment h-full rounded-full"
      [class]="segment.colorClass"
      [style.flex-grow]="segment.units"
      [style.flex-basis.px]="0"
      [style.min-width.px]="minSegmentWidth"
    ></span>
  }
</div>
<ul class="legend mt-3 mb-0 flex list-none flex-wrap gap-x-4 gap-y-1.5 p-0">
  @for (item of legend(); track item.key) {
    <li class="flex min-w-0 items-center gap-1.5 text-sm">
      <span class="h-2.5 w-2.5 shrink-0 rounded-full" [class]="item.colorClass" aria-hidden="true"></span>
      <span class="min-w-0 break-words text-muted">{{ item.label }}</span>&ngsp;<span class="font-mono font-bold">{{ item.units }}</span>
    </li>
  }
</ul>
