<div class="flex flex-col gap-2">
  <label id="product-label" for="product-search" class="field-label">Producto</label>

  @if (!hasDeliverable()) {
    <p
      class="empty m-0 surface-card border-dashed border-line-strong p-4 text-center text-sm text-muted"
    >
      No hay productos con piezas en la bodega.
    </p>
  } @else {
    <p-select
      inputId="product-search"
      ariaLabelledBy="product-label"
      [options]="options()"
      optionLabel="name"
      optionValue="id"
      [filter]="true"
      filterBy="searchText"
      filterPlaceholder="Buscar por nombre"
      placeholder="Buscar por nombre"
      [invalid]="invalid()"
      [showClear]="false"
      [motionOptions]="motionOptions"
      (onChange)="onProductChange($event)"
      class="h-[52px] min-w-0 w-full"
    >
      <ng-template #item let-product>
        <div class="option flex w-full items-center gap-3 py-1">
          @if (showPhoto(product)) {
            <img
              [src]="product.image"
              alt=""
              loading="lazy"
              (error)="onPhotoError(product.id)"
              class="h-12 w-12 flex-shrink-0 rounded-md object-cover"
            />
          } @else {
            <span
              class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-md bg-line text-sm font-bold"
              aria-hidden="true"
              >{{ initialsOf(product.name) }}</span
            >
          }
          <span class="min-w-0 flex-1 text-sm leading-tight font-bold break-words">{{
            product.name
          }}</span>
          <span class="font-mono text-sm font-bold whitespace-nowrap">
            {{ product.stock }}
            <span class="font-sans text-xs font-medium text-muted">en bodega</span>
          </span>
        </div>
      </ng-template>
      <ng-template #emptyfilter>
        <span class="empty text-sm text-muted">No hay productos con ese nombre.</span>
      </ng-template>
    </p-select>
  }
</div>
