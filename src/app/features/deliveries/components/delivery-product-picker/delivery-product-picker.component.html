<div class="flex flex-col gap-2">
  <label for="product-search" class="field-label">Producto</label>
  <input
    id="product-search"
    type="search"
    autocomplete="off"
    placeholder="Buscar por nombre"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [class]="
      'field-input w-full ' + (invalid() ? 'border-2 border-danger' : 'border border-line-strong')
    "
  />

  @if (!hasDeliverable()) {
    <p
      class="empty m-0 surface-card border-dashed border-line-strong p-4 text-center text-sm text-muted"
    >
      No hay productos con piezas en la bodega.
    </p>
  } @else if (visible().length === 0) {
    <p
      class="empty m-0 surface-card border-dashed border-line-strong p-4 text-center text-sm text-muted"
    >
      No hay productos con ese nombre.
    </p>
  } @else {
    <ul
      class="m-0 flex max-h-72 list-none flex-col gap-2 overflow-y-auto p-0"
      aria-label="Productos con piezas en la bodega"
    >
      @for (product of visible(); track product.id) {
        <li>
          <button
            type="button"
            class="option surface-interactive flex w-full items-center gap-3 p-2.5 text-left text-ink hover:border-line-strong"
            (click)="picked.emit(product.id)"
          >
            @if (showPhoto(product)) {
              <img
                [src]="product.image"
                alt=""
                loading="lazy"
                (error)="onPhotoError(product.id)"
                class="h-12 w-12 flex-shrink-0 rounded-md object-cover"
              />
            } @else {
              <span
                class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-md bg-line text-sm font-bold"
                aria-hidden="true"
                >{{ initialsOf(product.name) }}</span
              >
            }
            <span class="min-w-0 flex-1 text-sm leading-tight font-bold break-words">{{
              product.name
            }}</span>
            <span class="font-mono text-sm font-bold whitespace-nowrap">
              {{ product.stock }}
              <span class="font-sans text-xs font-medium text-muted">en bodega</span>
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>
