<section class="mt-2 flex flex-col gap-3" aria-labelledby="seller-status-title">
  <h3 id="seller-status-title" class="m-0 text-[13px] font-bold uppercase tracking-wide text-muted">{{ title }}</h3>

  @if (notice(); as alert) {
    <div class="flex flex-col items-start gap-2 alert-warning p-4" role="alert">
      <p class="m-0 text-sm font-semibold leading-snug">{{ alert.message }}</p>
      @if (alert.showReturn) {
        <button pButton severity="secondary" type="button" class="h-11 px-4 text-sm" (click)="returnUnits.emit()">
          Retirar producto
        </button>
      }
    </div>
  }

  <div class="surface-card flex flex-col divide-y divide-line overflow-hidden">
  @if (active()) {
    <div class="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
      <button
        pButton
        severity="secondary"
        type="button"
        class="change-password h-11 w-full shrink-0 px-4 text-sm sm:order-2 sm:w-48"
        [disabled]="busy() !== null"
        (click)="changePassword.emit()"
      >
        {{ changePasswordLabel }}
      </button>
      <p class="m-0 text-xs leading-snug text-muted sm:order-1 sm:flex-1">{{ changePasswordHelp }}</p>
    </div>
    <div class="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
      <button
        pButton
        severity="secondary"
        [outlined]="true"
        type="button"
        class="h-11 w-full shrink-0 px-4 text-sm sm:order-2 sm:w-48"
        [disabled]="busy() !== null"
        (click)="deactivate.emit()"
      >
        {{ busy() === 'deactivate' ? labels.deactivate.busy : labels.deactivate.idle }}
      </button>
      <p class="m-0 text-xs leading-snug text-muted sm:order-1 sm:flex-1">{{ deactivateHelp }}</p>
    </div>
  } @else {
    <div class="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
      <button
        pButton
        severity="secondary"
        type="button"
        class="h-11 w-full shrink-0 px-4 text-sm sm:order-2 sm:w-48"
        [disabled]="busy() !== null"
        (click)="reactivate.emit()"
      >
        {{ busy() === 'reactivate' ? labels.reactivate.busy : labels.reactivate.idle }}
      </button>
      <p class="m-0 text-xs leading-snug text-muted sm:order-1 sm:flex-1">{{ reactivateHelp }}</p>
    </div>
  }

  <div class="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
    <button
      pButton
      severity="danger"
      [outlined]="true"
      type="button"
      class="h-11 w-full shrink-0 px-4 text-sm sm:order-2 sm:w-48"
      [disabled]="busy() !== null"
      (click)="remove.emit()"
    >
      {{ busy() === 'remove' ? labels.remove.busy : labels.remove.idle }}
    </button>
    <p class="m-0 text-xs leading-snug text-muted sm:order-1 sm:flex-1">{{ removeHelp }}</p>
  </div>
  </div>
</section>
