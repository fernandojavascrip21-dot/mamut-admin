<section class="mt-5 flex flex-col gap-4 border-t border-line pt-5" aria-labelledby="seller-status-title">
  <h3 id="seller-status-title" class="m-0 text-[15px] font-bold">{{ title }}</h3>

  @if (notice(); as alert) {
    <div class="flex flex-col items-start gap-2 alert-warning p-4" role="alert">
      <p class="m-0 text-sm font-semibold leading-snug">{{ alert.message }}</p>
      @if (alert.showReturn) {
        <button pButton severity="secondary" type="button" class="h-11 px-4 text-sm" (click)="returnUnits.emit()">
          Retirar producto
        </button>
      }
    </div>
  }

  @if (active()) {
    <div class="flex flex-col gap-1">
      <button
        pButton
        severity="secondary"
        [outlined]="true"
        type="button"
        class="h-11 w-full px-4 text-sm sm:w-auto sm:self-start"
        [disabled]="busy() !== null"
        (click)="deactivate.emit()"
      >
        {{ busy() === 'deactivate' ? labels.deactivate.busy : labels.deactivate.idle }}
      </button>
      <p class="m-0 text-xs leading-snug text-muted">{{ deactivateHelp }}</p>
    </div>
  } @else {
    <div class="flex flex-col gap-1">
      <button
        pButton
        severity="secondary"
        type="button"
        class="h-11 w-full px-4 text-sm sm:w-auto sm:self-start"
        [disabled]="busy() !== null"
        (click)="reactivate.emit()"
      >
        {{ busy() === 'reactivate' ? labels.reactivate.busy : labels.reactivate.idle }}
      </button>
      <p class="m-0 text-xs leading-snug text-muted">{{ reactivateHelp }}</p>
    </div>
  }

  <div class="flex flex-col gap-1">
    <button
      pButton
      severity="danger"
      [outlined]="true"
      type="button"
      class="h-11 w-full px-4 text-sm sm:w-auto sm:self-start"
      [disabled]="busy() !== null"
      (click)="remove.emit()"
    >
      {{ busy() === 'remove' ? labels.remove.busy : labels.remove.idle }}
    </button>
    <p class="m-0 text-xs leading-snug text-muted">{{ removeHelp }}</p>
  </div>
</section>
