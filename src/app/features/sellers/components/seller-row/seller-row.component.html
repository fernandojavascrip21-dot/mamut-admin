<a
  [routerLink]="['/admin/vendedores', seller().id]"
  [attr.aria-label]="'Ver a ' + seller().fullName + ', ' + units()"
  class="group block min-w-0 cursor-pointer rounded-card text-ink no-underline transition-[transform,translate,scale] duration-200 hover:-translate-y-0.5 hover:text-ink active:scale-[0.99] focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transform-none motion-reduce:translate-none motion-reduce:scale-none motion-reduce:transition-none motion-reduce:hover:translate-none motion-reduce:active:scale-none"
>
  <p-card
    class="block min-h-[80px] border border-line transition-[box-shadow,border-color] duration-200 group-hover:border-line-strong group-hover:shadow-raised motion-reduce:transition-none"
    [pt]="cardPassThrough"
  >
    <div class="flex min-h-[80px] min-w-0 items-center gap-3 px-4 py-4">
      <span
        class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-accent-2-bg text-base font-bold text-accent-2-text"
        aria-hidden="true"
      >
        {{ initials() }}
      </span>
      <span class="min-w-0 flex-1 truncate text-[17px] font-bold">{{ seller().fullName }}</span>
      <span class="units font-mono text-base font-bold whitespace-nowrap">{{ units() }}</span>
      <svg
        aria-hidden="true"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="flex-shrink-0 stroke-muted"
      >
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </div>
  </p-card>
</a>
