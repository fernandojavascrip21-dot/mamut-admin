<a
  [routerLink]="['/admin/vendedores', seller().id]"
  [attr.aria-label]="'Ver a ' + seller().fullName + ', ' + units()"
  class="surface-interactive flex min-h-[80px] min-w-0 items-center gap-3 px-4 py-4 text-ink hover:border-line-strong"
>
  <span
    class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-accent-2-bg text-base font-bold text-accent-2-text"
    aria-hidden="true"
  >
    {{ initials() }}
  </span>
  <span class="min-w-0 flex-1 truncate text-[17px] font-bold">{{ seller().fullName }}</span>
  <span class="units font-mono text-base font-bold whitespace-nowrap">{{ units() }}</span>
  <svg
    aria-hidden="true"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="flex-shrink-0 stroke-muted"
  >
    <path d="m9 18 6-6-6-6"></path>
  </svg>
</a>
