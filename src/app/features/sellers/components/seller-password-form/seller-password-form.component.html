<form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="onSubmit()" novalidate>
  <div class="flex min-w-0 flex-col gap-1.5">
    <label for="seller-password" class="field-label">{{ texts.passwordLabel }}</label>
    <p-password
      inputId="seller-password"
      formControlName="password"
      autocomplete="new-password"
      [toggleMask]="true"
      [feedback]="false"
      [invalid]="!!errors().password"
      [pt]="errors().password ? invalidPt : {}"
      [fluid]="true"
      inputStyleClass="h-[52px]"
    />
    <p id="seller-password-hint" class="m-0 text-xs text-muted">{{ texts.hint }}</p>
    @if (errors().password) {
      <p id="seller-password-error" class="field-error m-0 text-[13px] font-semibold text-danger" role="alert">
        {{ errors().password }}
      </p>
    }
  </div>

  <div class="flex min-w-0 flex-col gap-1.5">
    <label for="seller-password-confirmation" class="field-label">{{ texts.confirmationLabel }}</label>
    <p-password
      inputId="seller-password-confirmation"
      formControlName="confirmation"
      autocomplete="new-password"
      [toggleMask]="true"
      [feedback]="false"
      [invalid]="!!errors().confirmation"
      [pt]="errors().confirmation ? invalidPt : {}"
      [fluid]="true"
      inputStyleClass="h-[52px]"
    />
    @if (errors().confirmation) {
      <p id="seller-password-confirmation-error" class="field-error m-0 text-[13px] font-semibold text-danger" role="alert">
        {{ errors().confirmation }}
      </p>
    }
  </div>

  <div class="sticky bottom-0 z-10 flex flex-col gap-3 border-t border-line bg-page pt-4 sm:flex-row-reverse sm:justify-start">
    <button pButton type="submit" [disabled]="saving()" class="h-12 min-w-0 px-6 text-base sm:min-w-44">
      {{ saving() ? texts.saving : texts.submit }}
    </button>
    <button pButton severity="secondary" type="button" class="h-12 min-w-0 px-6 text-base sm:min-w-44" (click)="cancel.emit()">
      {{ texts.cancel }}
    </button>
  </div>
</form>
