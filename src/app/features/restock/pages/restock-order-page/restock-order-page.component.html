<app-modal-panel [title]="texts.title" [wide]="true" (closed)="close()">
  <div class="flex h-full min-h-0 flex-col gap-3">
    @if (failed()) {
      <div class="alert-danger flex shrink-0 flex-col items-start gap-2 text-sm" role="alert">
        <p class="m-0">{{ texts.loadFailed }}</p>
        <button
          pButton
          type="button"
          severity="secondary"
          [text]="true"
          class="h-11 min-w-11 px-3 text-sm"
          (click)="retry()"
        >
          {{ texts.retry }}
        </button>
      </div>
    } @else if (notFound()) {
      <div class="surface-card flex flex-1 flex-col items-center justify-center gap-4 p-6 text-center">
        <p class="m-0 text-base font-bold text-ink">{{ texts.notFound }}</p>
        <button
          pButton
          type="button"
          severity="secondary"
          class="h-11 px-4 text-sm"
          (click)="backToHistory()"
        >
          {{ texts.backToHistory }}
        </button>
      </div>
    } @else if (order(); as current) {
      <app-restock-order-detail class="flex min-h-0 flex-1 flex-col" [order]="current" />

      <!-- Pie fijo: el total arriba y, debajo, las acciones (apiladas a 375 px). -->
      <footer class="surface-card flex shrink-0 flex-col gap-3 p-3 sm:p-4">
        <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
          <p class="m-0 text-sm font-semibold text-ink">{{ countsLabel() }}</p>
          <p class="m-0 text-sm text-ink">
            {{ texts.total }}
            <span class="text-base font-bold tabular-nums">
              {{ current.estimatedTotal | currency: 'MXN' : 'symbol-narrow' }}
            </span>
          </p>
        </div>
        <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:justify-between">
          <app-restock-export-buttons
            class="w-full sm:w-auto"
            [busyFormat]="busyFormat()"
            (exportRequested)="exportOrder($event)"
          />
          <button
            pButton
            type="button"
            class="h-11 w-full px-4 text-sm sm:w-auto"
            (click)="useAsBase()"
          >
            {{ texts.useAsBase }}
          </button>
        </div>
        <div class="flex justify-center sm:justify-start">
          <button
            pButton
            type="button"
            severity="secondary"
            [text]="true"
            class="h-11 px-3 text-sm"
            (click)="backToHistory()"
          >
            {{ texts.backToHistory }}
          </button>
        </div>
      </footer>
    } @else {
      <div class="flex flex-1 flex-col gap-3" aria-busy="true" [attr.aria-label]="texts.loadingLabel">
        <p-skeleton height="8rem" borderRadius="0.75rem" />
        <p-skeleton height="3.5rem" borderRadius="0.75rem" />
      </div>
    }
  </div>
</app-modal-panel>
