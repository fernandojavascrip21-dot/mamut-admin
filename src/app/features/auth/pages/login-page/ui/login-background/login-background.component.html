<!-- Fondo del panel oscuro del login: resplandor ámbar, columnas de stock que crecen al entrar y
     después suben y bajan, un haz de luz que cruza y grano. Todo decorativo. -->
<div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
  <div class="absolute inset-0 bg-radial-[at_50%_110%] from-accent/35 via-accent-2/10 to-transparent to-70%"></div>

  <div class="absolute inset-x-0 bottom-0 flex h-[30%] items-end lg:h-[42%] gap-1 px-1">
    @for (bar of bars; track $index) {
      <div
        class="stock-bar flex-1 origin-bottom animate-stock-grow motion-reduce:animate-none"
        [class]="bar.showOnMobile ? 'block' : 'hidden sm:block'"
        [style.height.%]="bar.heightPercent"
        [style.animation-delay.s]="bar.growDelaySeconds"
      >
        <div
          class="stock-level flex h-full origin-bottom animate-stock-level flex-col-reverse gap-1 motion-reduce:animate-none"
          [style.animation-duration.s]="bar.durationSeconds"
          [style.animation-delay.s]="bar.delaySeconds"
        >
          <span class="segment bg-accent-2/45" [style.flex-grow]="bar.segments[0]"></span>
          <span class="segment bg-accent/55" [style.flex-grow]="bar.segments[1]"></span>
          <span class="segment bg-faint/30" [style.flex-grow]="bar.segments[2]"></span>
          <span class="segment rounded-t-md bg-page/15" [style.flex-grow]="bar.segments[3]"></span>
        </div>
      </div>
    }
  </div>

  <!-- Funde la parte alta hacia la tinta para que el titular quede limpio. -->
  <div class="absolute inset-0 bg-linear-to-b from-ink via-ink/70 to-transparent to-75%"></div>

  <div
    class="light-sweep absolute inset-y-0 left-0 w-1/4 animate-light-sweep bg-linear-to-r from-transparent via-page/10 to-transparent motion-reduce:hidden"
  ></div>

  <svg class="grain absolute inset-0 h-full w-full opacity-15 mix-blend-overlay">
    <filter id="login-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#login-grain)" />
  </svg>
</div>
